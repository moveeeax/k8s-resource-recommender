name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Runs the CLI end to end against the fixture-backed fake Prometheus and
      # asserts the patch it prints, so the documented usage cannot rot.
      - name: Run the example
        run: ./examples/demo.sh

  verify-patch-applies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The acceptance criterion is that the output applies with kubectl. A
      # client-side dry run needs no cluster and still exercises the real
      # strategic-merge decoder.
      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Patch a fixture Deployment with the generated output
        run: ./examples/verify-kubectl.sh
